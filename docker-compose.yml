services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenticrag
      POSTGRES_PASSWORD: agenticrag
      POSTGRES_DB: agenticrag
    ports:
      - "5432:5432"
    volumes:
      - agenticrag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticrag -d agenticrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  vespa:
    image: vespaengine/vespa
    hostname: vespa-container
    ports:
      - "8080:8080"
      - "19071:19071"
    volumes:
      - agenticrag_vespa:/opt/vespa/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19071/state/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    profiles: ["obs"]
    ports:
      - "16686:16686"
      - "4318:4318"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  agenticrag_pg:
  agenticrag_vespa:
