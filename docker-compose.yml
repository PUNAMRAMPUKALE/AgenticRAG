services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenticrag
      POSTGRES_PASSWORD: agenticrag
      POSTGRES_DB: agenticrag
    ports:
      - "5432:5432"
    volumes:
      - agenticrag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticrag -d agenticrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  vespa:
    image: vespaengine/vespa
    profiles: ["vespa"]
    hostname: vespa-container
    ports:
      - "8080:8080"
      - "19071:19071"

volumes:
  agenticrag_pg:
